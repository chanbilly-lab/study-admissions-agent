name: Quality (manual, disabled by default)
on:
  workflow_dispatch:
    inputs:
      execute_checks:
        description: Explicitly restore checks for this synthetic CI run
        type: boolean
        default: false
        required: true
      postgres_image:
        description: Official postgres:16.patch-bookworm@sha256:digest for an isolated CI database
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: manual-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    if: ${{ inputs.execute_checks == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      STUDY_CI_CHECKS: "1"
      STUDY_CI_POSTGRES_IMAGE: ${{ inputs.postgres_image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - name: Install locked dependencies (network only for setup)
        run: |
          python -m pip install --require-hashes -r requirements.txt
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm --dir apps/web install --frozen-lockfile
      - name: Contracts and originals
        run: python -B scripts/ci/run_checks.py contracts
      - name: Offline Python gates
        run: python -B scripts/ci/run_checks.py pure
      - name: Isolated PostgreSQL migration and critical HTTP gates
        run: python -B scripts/ci/run_checks.py postgres
      - name: Vue tests, types and both builds
        run: python -B scripts/ci/run_checks.py web
      # No data artifacts, secrets, deployments, image pushes or branch-rule changes.
